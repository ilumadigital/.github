<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="234" viewBox="0 0 1600 234" role="img" aria-labelledby="title">
<title id="title">ILUMA — The disciplines behind the work</title>
<rect width="1600" height="234" fill="#0a0a0a"/>
<path d="M50 32H1550M50 200H1550" stroke="#343434"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(70 0)"><text x="0" y="81" fill="#a2a2a2" font-size="20" letter-spacing="2">01 / DEFINE</text><text x="0" y="142" fill="#fff" font-size="36" font-weight="700">STRATEGY.</text><text x="0" y="177" fill="#aaa" font-size="19">Σκεφτόμαστε το γιατί.</text></g>
<g transform="translate(452 0)"><text x="0" y="81" fill="#a2a2a2" font-size="20" letter-spacing="2">02 / DESIGN</text><text x="0" y="142" fill="#fff" font-size="36" font-weight="700">CREATIVE.</text><text x="0" y="177" fill="#aaa" font-size="19">Σχεδιάζουμε το πώς.</text></g>
<g transform="translate(833 0)"><text x="0" y="81" fill="#a2a2a2" font-size="20" letter-spacing="2">03 / BUILD</text><text x="0" y="142" fill="#fff" font-size="36" font-weight="700">ENGINEERING.</text><text x="0" y="177" fill="#aaa" font-size="19">Χτίζουμε ό,τι χρειάζεται.</text></g>
<g transform="translate(1215 0)"><text x="0" y="81" fill="#a2a2a2" font-size="20" letter-spacing="2">04 / EVOLVE</text><text x="0" y="142" fill="#fff" font-size="36" font-weight="700">GROWTH.</text><text x="0" y="177" fill="#aaa" font-size="19">Εξελίσσουμε το αποτέλεσμα.</text></g>
</g>
